<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brickwright Build Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* layout: a white studio. The model is the only color on the page; type and rules stay black and gray. */
  --paper: #ffffff;
  --stage-a: #f1f2f0;
  --stage-b: #d9dcd8;
  --ink: #111315;
  --ink-2: #5c6167;
  --line: #e1e3df;
  --wash: #f4f5f3;
  --hot: #ff6a00;      /* new parts in a step, progress */
  --good: #1d7f4b;
  --paint: #184632;    /* follows the chosen body color */
  --display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
[hidden] { display: none !important; }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 28px; padding: 0 24px; height: 56px; flex: none; border-bottom: 1px solid var(--line); background: var(--paper); }
.brand { font-family: var(--display); font-stretch: 125%; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tabs a { display: flex; align-items: center; gap: 8px; padding: 0 12px; text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a i { font-style: normal; font-family: var(--display); font-stretch: 125%; font-size: 10px; font-weight: 600; width: 18px; height: 18px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--ink-2); }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); border-bottom-color: var(--ink); }
.tabs a.on i { background: var(--ink); color: #fff; border-color: var(--ink); }
.tabs a.lab { margin-left: 12px; }
.meta { margin-left: auto; font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.meta b { font-weight: 500; color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--paint); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); display: inline-block; flex: none; }

/* ---------- main grid ---------- */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
main[data-view='parts'], main[data-view='photo-lab'] { grid-template-columns: minmax(0, 1fr); }
main[data-view='parts'] .stage, main[data-view='photo-lab'] .stage, main[data-view='parts'] .panel, main[data-view='photo-lab'] .panel { display: none; }
.stage { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 38%, var(--stage-a) 0%, var(--stage-a) 38%, var(--stage-b) 100%); }
#viewer { position: absolute; inset: 0; }
.stage-ui { position: absolute; inset: 0; pointer-events: none; }
.stage-ui > * { pointer-events: auto; }
.panel { border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; background: var(--paper); }
.wide { overflow-y: auto; min-height: 0; }

/* title block on the stage */
.plate { position: absolute; left: 28px; top: 24px; max-width: min(520px, 70%); pointer-events: none; }
.eyebrow { font-family: var(--display); font-stretch: 125%; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
.plate h1 { font-family: var(--display); font-stretch: 125%; font-weight: 700; font-size: clamp(30px, 4.6vw, 58px); line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase; margin-top: 8px; }
.plate .sub { font-family: var(--display); font-stretch: 100%; font-size: clamp(15px, 1.6vw, 20px); font-weight: 400; margin-top: 6px; }
.specs { display: flex; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
.specs div { font-size: 12px; color: var(--ink-2); }
.specs b { display: block; font-family: var(--display); font-stretch: 112%; font-weight: 600; font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stage-ui .back { position: absolute; left: 24px; top: 20px; display: none; background: rgba(255, 255, 255, 0.9); }
.stage-ui.focus .back { display: inline-flex; }
.stage-ui.focus .plate, .stage-ui.focus .fine { display: none; }
.fine { position: absolute; left: 28px; bottom: 76px; font-size: 11px; color: var(--ink-2); max-width: 420px; pointer-events: none; }

.dock { position: absolute; left: 20px; right: 20px; bottom: 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.chips { display: flex; gap: 2px; background: rgba(255, 255, 255, 0.86); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(8px); }
.chips button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
.chips button:hover { color: var(--ink); }
.chips button.on { background: var(--ink); color: #fff; }
.slide { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.86); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--ink-2); backdrop-filter: blur(8px); }
.slide input { width: 120px; accent-color: var(--ink); }
.dock .push { margin-left: auto; }

.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; transform: translate(12px, 14px); max-width: 280px; }
.tip small { display: block; opacity: 0.7; font-variant-numeric: tabular-nums; }

/* ---------- panel pieces ---------- */
.p-head { padding: 26px 28px 20px; }
.p-head h2 { font-family: var(--display); font-stretch: 112%; font-size: 24px; font-weight: 600; line-height: 1.1; margin-top: 8px; }
.lede { color: var(--ink-2); margin-top: 8px; max-width: 62ch; }
.grp { padding: 18px 28px; border-top: 1px solid var(--line); }
.grp h3 { font-family: var(--display); font-stretch: 125%; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 12px; }
.grp.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
.note { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.note b { color: var(--ink); font-weight: 500; }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, 34px); gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16); position: relative; }
.sw.on::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--ink); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 7px 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--ink); color: #fff; }

.tg { display: flex; align-items: center; gap: 14px; padding: 9px 0; border: 0; background: none; width: 100%; text-align: left; }
.tg + .tg { border-top: 1px solid var(--wash); }
.tg span { flex: 1; }
.tg span small { display: block; color: var(--ink-2); font-size: 12.5px; }
.tg i { flex: none; width: 38px; height: 22px; border-radius: 999px; background: #cfd2cd; position: relative; transition: background 0.15s; }
.tg i::after { content: ''; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
.tg[aria-pressed='true'] i { background: var(--ink); }
.tg[aria-pressed='true'] i::after { transform: translateX(16px); }
.tg:disabled { opacity: 0.45; cursor: default; }

table.acc { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.acc th { text-align: right; font-weight: 500; color: var(--ink-2); font-size: 11.5px; padding: 0 0 6px 8px; }
table.acc th:first-child, table.acc td:first-child { text-align: left; padding-left: 0; }
table.acc td { text-align: right; padding: 6px 0 6px 8px; border-top: 1px solid var(--wash); }
table.acc td.d { font-weight: 500; }
table.acc td.d.off { color: #a34a00; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #2a2d31; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.cta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 18px 28px 28px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: linear-gradient(to top, #fff 82%, rgba(255, 255, 255, 0)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
.field input, .field select, .code { height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; font-size: 14px; color: var(--ink); background: #fff; width: 100%; min-width: 0; }
.code { font-variant-numeric: tabular-nums; font-size: 12.5px; flex: 1; }

ul.details { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.details button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 10px; display: grid; gap: 2px; }
ul.details button:hover, ul.details button.on { background: var(--wash); }
ul.details b { font-weight: 500; }
ul.details span { font-size: 12.5px; color: var(--ink-2); }
ul.details em { font-style: normal; font-size: 12.5px; color: var(--ink); }

/* ---------- build ---------- */
.b-head { padding: 24px 28px 6px; }
.b-step { display: flex; align-items: flex-end; gap: 16px; margin-top: 6px; }
.b-num { font-family: var(--display); font-stretch: 125%; font-weight: 700; font-size: 92px; line-height: 0.8; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.b-of { font-size: 13px; color: var(--ink-2); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.b-title { font-family: var(--display); font-stretch: 112%; font-size: 23px; font-weight: 600; line-height: 1.12; margin-top: 18px; }
.b-text { font-size: 16.5px; line-height: 1.5; margin-top: 10px; max-width: 46ch; }
.b-tip { margin-top: 12px; padding: 10px 12px; border-left: 2px solid var(--hot); background: #fff6ee; font-size: 14px; border-radius: 0 8px 8px 0; }
.callout { margin: 18px 28px 0; border: 1.5px solid var(--ink); border-radius: 14px; padding: 12px; background: #f6f9fb; }
.callout h3 { font-family: var(--display); font-stretch: 125%; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; }
.need { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.need div { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 26px 8px 8px; text-align: center; font-size: 11.5px; line-height: 1.25; color: var(--ink-2); position: relative; }
.need img { width: 64px; height: 64px; display: block; margin: 0 auto 4px; background: #e6e8e4; border-radius: 10px; }
.need b { position: absolute; left: 8px; top: 6px; font-family: var(--display); font-stretch: 112%; font-size: 15px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.b-nav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: 18px 28px 10px; position: sticky; bottom: 0; background: linear-gradient(to top, #fff 86%, rgba(255, 255, 255, 0)); }
.b-nav .btn { height: 52px; font-size: 16px; }
.b-extra { padding: 0 28px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.rail { position: absolute; left: 20px; right: 20px; top: 18px; display: flex; gap: 4px; }
.rail button { flex: var(--n) 1 0; border: 0; padding: 0; background: none; text-align: left; min-width: 0; }
.rail button span { display: block; height: 5px; border-radius: 3px; background: rgba(17, 19, 21, 0.12); overflow: hidden; }
.rail button span::after { content: ''; display: block; height: 100%; width: var(--p); background: var(--hot); }
.rail button em { display: block; font-style: normal; font-size: 11px; color: var(--ink-2); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail button.on em { color: var(--ink); font-weight: 600; }

/* ---------- parts ---------- */
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100%; }
.two-col > .col { padding: 28px 32px 48px; min-width: 0; }
.two-col > aside { border-left: 1px solid var(--line); padding: 28px; }
.h-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.h-row h2 { font-family: var(--display); font-stretch: 112%; font-size: 30px; font-weight: 600; line-height: 1.05; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0; }
.filters button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
.filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.lot { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; align-items: center; background: #fff; }
.lot.done { background: var(--wash); }
.lot img { width: 76px; height: 76px; background: #e6e8e4; border-radius: 12px; }
.lot .q { font-family: var(--display); font-stretch: 112%; font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.lot .n { font-size: 12.5px; line-height: 1.25; margin-top: 4px; }
.lot .id { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.lot .id i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2); flex: none; }
.have { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--wash); padding-top: 8px; margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
.have button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: #fff; line-height: 1; }
.have b { color: var(--ink); min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.have .all { margin-left: auto; width: auto; padding: 0 8px; font-size: 12px; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 18px; }
.sum div { font-size: 12px; color: var(--ink-2); }
.sum b { display: block; font-family: var(--display); font-stretch: 112%; font-size: 26px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stack { display: grid; gap: 8px; }
ol.how { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; }
.side-h { font-family: var(--display); font-stretch: 125%; font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); margin: 26px 0 10px; }
.side-h:first-child { margin-top: 0; }

/* ---------- stickers ---------- */
.sheet { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--wash); padding: 12px; }
.sheet canvas { width: 100%; height: auto; display: block; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12); }
.where { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.where li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
.where b { font-weight: 500; }

/* ---------- photo lab ---------- */
.drop { border: 1.5px dashed #b9bdb6; border-radius: 14px; padding: 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--wash); margin-top: 18px; }
.drop.over { border-color: var(--ink); background: #fff; }
.drop p { flex: 1; min-width: 200px; color: var(--ink-2); font-size: 14px; }
.mos { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.mos canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
.mos figure { margin: 0; }
.mos figcaption { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.secs { display: grid; gap: 4px; margin-top: 8px; }
.secs button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 0; font-size: 12px; font-variant-numeric: tabular-nums; }
.secs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; margin-top: 10px; font-size: 12.5px; }
.legend div { display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
.legend i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2); flex: none; font-style: normal; font-size: 10px; display: grid; place-items: center; color: var(--t); font-weight: 600; }
.legend span { margin-left: auto; color: var(--ink-2); }
.range { display: grid; grid-template-columns: 90px 1fr 36px; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.range input { accent-color: var(--ink); width: 100%; }
.brief { border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 14px; display: grid; gap: 8px; }
.brief h4 { margin: 0; font-size: 15px; font-weight: 600; }
.brief ul { margin: 0; padding-left: 18px; }

/* ---------- overlays ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: 90vw; }
.modal { position: fixed; inset: 0; background: rgba(17, 19, 21, 0.45); z-index: 50; display: grid; place-items: center; padding: 20px; }
.sheet-modal { background: #fff; border-radius: 18px; padding: 26px; width: min(560px, 100%); max-height: 90%; overflow: auto; position: relative; }
.sheet-modal h2 { font-family: var(--display); font-stretch: 112%; font-size: 24px; font-weight: 600; line-height: 1.1; }
.sheet-modal p { margin-top: 10px; color: var(--ink-2); }
.sheet-modal textarea { width: 100%; height: 200px; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
.sheet-modal .row { margin-top: 16px; }
.bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; margin-top: 16px; }
.bar i { display: block; height: 100%; width: 0; background: var(--hot); transition: width 0.2s; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; }

/* ---------- narrow screens ---------- */
.m-only { display: none; }
@media (max-width: 940px) {
  #app { height: auto; min-height: 100%; }
  .top { flex-wrap: wrap; height: auto; padding: 10px 16px 0; gap: 4px 16px; }
  .tabs { order: 3; width: 100%; overflow-x: auto; height: 44px; }
  .tabs a { padding: 0 10px; }
  .tabs a.lab { margin-left: 4px; }
  main { display: block; }
  .stage { height: min(104vw, 560px); }
  .specs { display: none; }
  .dock { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .dock > * { flex: none; }
  .dock .push { margin-left: 0; }
  .tabs a { font-size: 13.5px; gap: 6px; }
  .tabs a i { display: none; }
  .meta { font-size: 12px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .wide { overflow: visible; }
  .two-col { display: block; }
  .two-col > .col { padding: 22px 16px 28px; }
  .two-col > aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  .plate { left: 16px; top: 14px; }
  .plate h1 { font-size: 26px; margin-top: 4px; }
  .plate .sub { font-size: 14px; margin-top: 2px; }
  .fine { display: none; }
  .m-only { display: block; }
  .dock { left: 10px; right: 10px; bottom: 10px; gap: 8px; }
  .slide input { width: 80px; }
  .rail { left: 10px; right: 10px; top: 10px; }
  .rail button em { display: none; }
  .p-head, .grp, .b-head { padding-left: 16px; padding-right: 16px; }
  .callout { margin-left: 16px; margin-right: 16px; }
  .cta, .b-nav, .b-extra { padding-left: 16px; padding-right: 16px; }
  .b-num { font-size: 68px; }

  // Bricks

  add('3068b', 'Tile 2 x 2 with Groove', 'tile', [2, 2, 1], 'Tiles');
  add('63864', 'Tile 1 x 3', 'tile', [1, 3, 1], 'Tiles');
  add('4162', 'Tile 1 x 8', 'tile', [1, 8, 1], 'Tiles');
  add('87079', 'Tile 2 x 4', 'tile', [2, 4, 1], 'Tiles');
  // Round
  add('98138', 'Tile, Round 1 x 1', 'roundtile', [1, 1, 1], 'Lights', { studs: 'none' });
  add('4073', 'Plate, Round 1 x 1', 'roundplate', [1, 1, 1], 'Round');

  // Modified and special
  add('87087', 'Brick, Modified 1 x 1 with Stud on Side', 'sidestud', [1, 1, 3], 'Special bricks');
  add('2877', 'Brick, Modified 1 x 2 with Grille', 'grille', [2, 1, 3], 'Special bricks');
  add('2458', 'Brick, Modified 1 x 2 with Pin', 'pinbrick', [2, 1, 3], 'Special bricks');
  add('61252', 'Plate, Modified 1 x 1 with Open O Clip (Horizontal Grip)', 'clip', [1, 1, 1], 'Special plates');
  add('30157', 'Plate, Modified 2 x 4 with Pins', 'axle', [4, 2, 1], 'Special plates');

  BW.PARTS = P;

  // lookup of plain box parts by kind and footprint
  const BOX = {};
  Object.values(P).forEach((p) => {
    if (p.k === 'brick' || p.k === 'plate' || p.k === 'tile') {
      if (p.id === '3065') return; // only used for transparent colors
      BOX[p.k + ':' + p.d[0] + 'x' + p.d[1]] = p.id;
    }
  });
  BW.boxPart = function (kind, a, b, colorKey) {
    const w = Math.min(a, b), l = Math.max(a, b);
    if (kind === 'brick' && w === 1 && l === 2 && BW.COLORS[colorKey] && BW.COLORS[colorKey].trans) return '3065';
    const id = BOX[kind + ':' + w + 'x' + l];
    if (!id) throw new Error('No catalog part for ' + kind + ' ' + w + 'x' + l);
    return id;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = BW;

/* ---- model-grenadier.js ---- */
/* Grenadier station wagon, 8 studs wide, about 1:30. Second design pass, drawn from reference photos.
   Coordinates: x 0..8 across (0 = vehicle left), y 0..20 front to rear, z in plates (0 = underside of the wheel holders). */
(function (root) {
  const BW = root.BW || (typeof require !== 'undefined' ? require('./catalog.js') : {});

  const PAINTS = [
    { key: 'white', like: 'Scottish White', tier: 'core' },
    { key: 'dktan', like: 'Magic Mushroom', tier: 'wide' },
    { key: 'dkblue', like: 'Britannia Blue', tier: 'wide' },
    { key: 'sandblue', like: 'Eldoret Blue', tier: 'check' },
    { key: 'dkgreen', like: 'Sela Green', tier: 'wide' },
    { key: 'black', like: 'Inky Black', tier: 'core' },
    { key: 'dbg', like: 'Donny Grey', tier: 'core' },
    { key: 'lbg', like: 'Sterling Silver', tier: 'core' },
    { key: 'dkred', like: "Queen's Red", tier: 'wide' },
    { key: 'red', like: 'Devil Red', tier: 'core' },
    { key: 'olive', like: null, tier: 'check' },
    { key: 'tan', like: null, tier: 'core' },
    { key: 'yellow', like: null, tier: 'core' },
    { key: 'orange', like: null, tier: 'wide' },
    { key: 'sandgreen', like: null, tier: 'check' },
  ];

  const DEFAULTS = {
    paint: 'white', roof: 'body', glass: 'trbrown', wheels: 'black', tyres: 'offroad', drive: 'lhd', seats: 'black',
    spare: true, rack: true, gear: false, snorkel: true, checker: true, safari: true, lightbar: false,
  };

  const OPTIONS = {
    roof: [['body', 'Body color'], ['white', 'White'], ['black', 'Black']],
    glass: [['trbrown', 'Smoke'], ['trclear', 'Clear'], ['trltblue', 'Light blue']],
    wheels: [['black', 'Black'], ['lbg', 'Steel gray'], ['white', 'White']],
    tyres: [['offroad', 'Off-road 30.4 mm'], ['road', 'Road 24 mm']],
    drive: [['lhd', 'Left-hand drive'], ['rhd', 'Right-hand drive']],
    seats: [['black', 'Black'], ['dktan', 'Saddle'], ['lbg', 'Gray']],
    toggles: [
      ['spare', 'Spare wheel', 'Full-size spare on the big rear door'],
      ['rack', 'Roof rack', 'Black platform rack on four crossbars'],
      ['gear', 'Expedition gear', 'Crate, duffel and two fuel cans (needs the rack)'],
      ['snorkel', 'Raised air intake', 'Runs up the right windshield pillar'],
      ['checker', 'Checker plates', 'Black tread plates on the front fender tops'],
      ['safari', 'Safari windows', 'Two glass panels set flush in the roof over the front seats'],
      ['lightbar', 'Roof light bar', 'Four lamps above the windshield'],
    ],
  };

  const REAL = {
    name: 'INEOS Grenadier Station Wagon',
    length: 4896, body: 4683, width: 1930, height: 2036, wheelbase: 2922, frontOverhang: 887, rearOverhang: 874, tyre: 804,
  };

  function build(userCfg) {
    const cfg = Object.assign({}, DEFAULTS, userCfg || {});
    if (!cfg.rack) cfg.gear = false;
    const PARTS = BW.PARTS;
    const parts = [], steps = [];
    let cur = null;

    const body = cfg.paint;
    const roofC = cfg.roof === 'body' ? body : cfg.roof;
    const K = 'black';
    const glass = cfg.glass;
    const seatC = cfg.seats;

    function step(stage, title, text, tip) {
      cur = { n: steps.length + 1, stage, title, text, tip: tip || '', parts: [] };
      steps.push(cur);
    }
    function put(p) { p.i = parts.length; p.step = cur.n; parts.push(p); cur.parts.push(p.i); return p; }
    function box(kind, x, y, z, w, l, color, tag) {
      // catalog boxes are defined short side across; turn them when the long side runs across the vehicle
      return put({ pid: BW.boxPart(kind, w, l, color), color, x, y, z, w, l, h: kind === 'brick' ? 3 : 1, yaw: w > l ? 90 : 0, mode: 'up', tag });
    }
    const B = (x, y, z, w, l, c, tag) => box('brick', x, y, z, w, l, c, tag);
    const Pl = (x, y, z, w, l, c, tag) => box('plate', x, y, z, w, l, c, tag);
    const T = (x, y, z, w, l, c, tag) => box('tile', x, y, z, w, l, c, tag);
    function X(pid, x, y, z, yaw, color, tag) {
      const d = PARTS[pid].d, sw = yaw === 90 || yaw === 270;
      return put({ pid, color, x, y, z, w: sw ? d[1] : d[0], l: sw ? d[0] : d[1], h: d[2], yaw, mode: 'up', tag });
    }
    // a part pushed onto a sideways stud. dir -1 faces the front, +1 faces the rear
    function side(pid, color, host, dir, tag, o) {
      o = o || {};
      const th = 0.4;
      const face = o.face != null ? o.face : host.mode === 'snot' ? (dir < 0 ? host.box[1] : host.box[4]) : (dir < 0 ? host.y : host.y + host.l);
      const y0 = dir < 0 ? face - th : face, y1 = y0 + th;
      const cx = o.cx != null ? o.cx : host.mode === 'snot' ? host.c[0] : host.x + 0.5;
      const cz = o.cz != null ? o.cz : host.mode === 'snot' ? host.c[2] : host.z + 1.5;
      const wx = o.wx || 1, hz = o.hz || 2.5;
      return put({ pid, color, mode: 'snot', axis: 'y', dir, host: host.i, pre: o.pre || 0, c: [cx, (y0 + y1) / 2, cz], box: [cx - wx / 2, y0, cz - hz / 2, cx + wx / 2, y1, cz + hz / 2], tag });
    }
    const tyreId = cfg.tyres === 'road' ? '30648' : '30391';
    const Rmm = cfg.tyres === 'road' ? 12 : 15.2;
    const Rp = Rmm / BW.PLATE_MM, Rs = Rmm / BW.STUD_MM;
    function wheel(host, c, axis, dir, tag) {
      const hw = 0.875;
      const bx = axis === 'x'
        ? [c[0] - hw, c[1] - Rs, c[2] - Rp, c[0] + hw, c[1] + Rs, c[2] + Rp]
        : [c[0] - Rs, c[1] - hw, c[2] - Rp, c[0] + Rs, c[1] + hw, c[2] + Rp];
      const tyre = put({ pid: tyreId, color: 'black', mode: 'tyre', axis, dir, host: host.i, c, R: Rs, box: bx, tag });
      put({ pid: '55981', color: cfg.wheels, mode: 'wheel', axis, dir, host: host.i, inside: tyre.i, c, R: 9 / BW.STUD_MM, box: bx, tag });
    }

    /* ---------- Stage 1: chassis ---------- */
    step('Chassis', 'Lay out the frame',
      'Find the two wheel holders. They are the flat plates with a pin on each end. Put them on the table with the pins pointing left and right, then put the long black plate between them like the picture.',
      'Leave a one-stud gap between each wheel holder and the long plate. The next step locks everything together.');
    const axF = X('30157', 2, 3, 0, 0, K, 'axle');
    const axR = X('30157', 2, 15, 0, 0, K, 'axle');
    Pl(3, 5, 0, 2, 10, K);

    step('Chassis', 'Add the floor',
      'Press the big black square plate onto the middle of the long plate. Add a gray 4 x 6 plate at the front and another at the back. Each gray plate sits on a wheel holder.',
      'The gray plates are the skid plates. On the real truck they protect the engine and the fuel tank from rocks.');
    Pl(0, 6, 1, 8, 8, K, 'sill');
    Pl(2, 0, 1, 4, 6, 'lbg', 'skid');
    Pl(2, 14, 1, 4, 6, 'lbg', 'skid');

    /* ---------- Stage 2: front end ---------- */
    step('Front end', 'Build the bumper',
      'Put a black 2 x 2 plate beside each front corner of the gray plate. Lay the black 1 x 8 plate across all three, one stud back from the front edge. Along the very front put a black 1 x 3 tile, the bracket piece, and another 1 x 3 tile. The bracket hangs down in front.',
      'The long plate and the tiles sit half on a corner plate and half on the gray plate. That is what holds the corners on.');
    Pl(0, 0, 1, 2, 2, K, 'bumper');
    Pl(6, 0, 1, 2, 2, K, 'bumper');
    Pl(0, 1, 2, 8, 1, K);
    T(0, 0, 2, 3, 1, K, 'bumper');
    const bracket = X('99781', 3, 0, 2, 0, K, 'bumper');
    T(5, 0, 2, 3, 1, K, 'bumper');

    step('Front end', 'Engine block and chin',
      'Behind the bumper, lay a body-color 1 x 8 plate on top of the black one. Then drop in two black 2 x 4 bricks, one behind the other, down the middle.');
    Pl(0, 1, 3, 8, 1, body, 'chin');
    B(2, 2, 2, 4, 2, K);
    B(2, 4, 2, 4, 2, K);

    step('Front end', 'Make the face',
      'Build the front row on the body-color plate. From left to right: a body-color light brick, a black light brick, two black grille bricks, a black light brick and a body-color light brick.',
      'Light bricks have a stud on one side. Point all four studs forward.');
    const hlL = X('87087', 0, 1, 4, 0, body, 'lampbrick');
    const auxL = X('87087', 1, 1, 4, 0, K, 'lampbrick');
    X('2877', 2, 1, 4, 0, K, 'grille');
    X('2877', 4, 1, 4, 0, K, 'grille');
    const auxR = X('87087', 6, 1, 4, 0, K, 'lampbrick');
    const hlR = X('87087', 7, 1, 4, 0, body, 'lampbrick');

    step('Front end', 'Wheel arch flares',
      'Add two black 4 x 4 plates side by side on the engine bricks. Each one hangs out over the place where a front wheel will go.',
      'These are the black flares over the front wheels.');
    Pl(0, 2, 5, 4, 4, K, 'flare');
    Pl(4, 2, 5, 4, 4, K, 'flare');

    step('Front end', 'Front deck',
      'Cover the black plates. Put the 2 x 8 plate across the front. Behind it put the 1 x 6 plate in the middle and a 1 x 2 plate on each outside edge, pointing backward.');
    Pl(0, 2, 6, 8, 2, body);
    Pl(1, 4, 6, 6, 1, body);
    Pl(0, 4, 6, 1, 2, body);
    Pl(7, 4, 6, 1, 2, body);

    /* ---------- Stage 3: cabin ---------- */
    step('Cabin', 'Start the doors',
      'On each side of the big black plate, add a 1 x 6 brick at the front and a 1 x 2 brick behind it. These are the bottoms of the doors.');
    B(0, 6, 2, 1, 6, body, 'door');
    B(0, 12, 2, 1, 2, body, 'door');
    B(7, 6, 2, 1, 6, body, 'door');
    B(7, 12, 2, 1, 2, body, 'door');

    const sx = cfg.drive === 'rhd' ? 5 : 1;
    step('Cabin', 'Fit out the floor',
      'Inside the cabin, put a black 1 x 6 brick across the front for the dashboard. Behind it add the black 1 x 2 brick on the driver side and the black 2 x 3 brick in the middle. Near the back, put in the 2 x 6 brick for the rear seat and a black 1 x 6 brick behind it.');
    B(1, 6, 2, 6, 1, K);
    B(sx, 7, 2, 2, 1, K);
    B(3, 7, 2, 2, 3, K, 'console');
    B(1, 11, 2, 6, 2, seatC, 'bench');
    B(1, 13, 2, 6, 1, K);

    step('Cabin', 'Seats and controls',
      'Press in the two front seats. Put the steering wheel on the black 1 x 2 brick. On the middle brick add, from front to back: the small black slope with its low side toward the seats, the gray 1 x 2 tile, and the two levers side by side.',
      'The slope is the big touchscreen. The two levers are the gear selector and the low-range lever, just like the real cabin.');
    X('4079', 1, 8, 2, 0, seatC, 'seat');
    X('4079', 5, 8, 2, 0, seatC, 'seat');
    X('3829c01', sx, 7, 5, 0, K, 'steering');
    X('85984', 3, 7, 5, 180, K, 'screen');
    T(3, 8, 5, 2, 1, 'dbg', 'switches');
    X('4592c02', 3, 9, 5, 0, K, 'lever');
    X('4592c02', 4, 9, 5, 0, K, 'lever');

    step('Cabin', 'Dashboard',
      'Put a black 1 x 6 plate on the dashboard brick and a 1 x 6 brick on the back edge of the rear seat. Now lock the front end to the cabin: lay the body-color 2 x 6 plate so it sits half on the dashboard and half on the black flare plates. Finish the dashboard with two more black 1 x 6 plates.',
      'This 2 x 6 plate is the most important joint in the truck. Press it down hard.');
    Pl(1, 6, 5, 6, 1, K);
    B(1, 12, 5, 6, 1, seatC);
    Pl(1, 5, 6, 6, 2, body);
    Pl(1, 6, 7, 6, 1, K, 'dash');
    Pl(1, 6, 8, 6, 1, K, 'dash');

    /* ---------- Stage 4: hood ---------- */
    step('Hood', cfg.checker ? 'Checker plates' : 'Fender tops',
      (cfg.checker
        ? 'Cover the top of each front fender with black grille tiles, laid crosswise. Start at the light bricks and work back.'
        : 'Cover the top of each front fender with a smooth 2 x 4 tile, then a 1 x 2 tile behind it.')
      + (cfg.snorkel ? ' On the right side, the last row is different: a 1 x 1 tile on the inside and a 1 x 1 plate on the outside. The plate is where the air intake will stand.' : ''),

  /* ================= PARTS ================= */

  function modelXML() { return bricklinkXML(toBuy().map((x) => ({ pid: x.l.pid, bl: x.l.col.bl, qty: x.qty }))); }
  function modelCSV() { return csv([['Quantity', 'BrickLink part', 'Part name', 'Color', 'BrickLink color id', 'Already have']].concat(lots.map((l) => [l.qty, l.pid, l.def.n, l.col.name, l.col.bl, haveOf(l)]))); }

  /* ================= BUILD ================= */

      '<div class="b-extra"><button class="btn small" id="booklet">Save instruction booklet (PDF)</button>' + (n === total ? '<a class="btn small" href="#stickers">Open stickers</a>' : '') + '</div>';

  function goStep(n) {

  /* ---------- instruction booklet ---------- */
  function offscreenViewer(w, h) {
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + w + 'px;height:' + h + 'px';
    document.body.appendChild(host);
    const v = BW.createViewer(host, { capture: true, static: true, pixelRatio: 1 });
    v.setModel(model);
    return { v, done() { v.dispose(); host.remove(); } };
  }
  const tick = () => new Promise((r) => setTimeout(r, 0));
  async function makeBooklet() {
    if (!window.jspdf) { toast('The PDF library did not load. Check the connection and reload.'); return; }
    const box = modal('<h2>Building your booklet</h2><p id="bkMsg">Rendering the cover.</p><div class="bar"><i id="bkBar"></i></div>');
    const bar = $('#bkBar', box), msg = $('#bkMsg', box);
    await tick();
    const off = offscreenViewer(1240, 1000);
    try {
      const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter', compress: true });
      const PW = 279.4, PH = 215.9, mg = 12, total = model.steps.length, o = overallMM();
      const BG = 0xf6f6f4;
      // cover
      off.v.showAll(); off.v.setView({ az: -0.72, el: 0.36, dist: 50 }, true);
      doc.addImage(off.v.snapshot(1480, 1000, 'image/jpeg', BG), 'JPEG', 0, 30, PW, PW * (1000 / 1480));
      doc.setFillColor(255, 255, 255); doc.rect(0, 0, PW, 46, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(34); doc.text('GRENADIER', mg, 24);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(15); doc.text('Station Wagon. Building instructions.', mg, 33);
      doc.setFontSize(10); doc.setTextColor(90);
      doc.text(model.parts.length + ' pieces   |   ' + total + ' steps   |   ' + fmt(o.L) + ' x ' + fmt(o.W) + ' x ' + fmt(o.H) + ' mm   |   scale 1:' + fmt(model.dims.scale, 0) + '   |   ages 10 and up', mg, 41);
      doc.setFontSize(8); doc.text('Independent fan design. Not made, licensed or endorsed by the LEGO Group or INEOS Automotive. LEGO is a trademark of the LEGO Group.', mg, PH - 6);
      doc.setTextColor(0);
      // parts pages
      const cols = 5, rows = 6, cw = (PW - 2 * mg) / cols, rh = (PH - 2 * mg - 14) / rows;
      for (let i = 0; i < lots.length; i++) {
        const k = i % (cols * rows);
        if (k === 0) { doc.addPage(); doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text('Parts you need', mg, mg + 6); doc.setFont('helvetica', 'normal'); }
        const l = lots[i], x = mg + (k % cols) * cw, y = mg + 14 + Math.floor(k / cols) * rh;
        doc.addImage(BW.thumb(l.pid, l.color, l.R), 'PNG', x, y, 20, 20);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.text(l.qty + 'x', x + 22, y + 7);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
        doc.text(doc.splitTextToSize(l.def.n, cw - 26).slice(0, 2), x + 22, y + 12);
        doc.setTextColor(100); doc.text(l.col.name + '  ' + l.pid, x + 22, y + 19.5); doc.setTextColor(0);
      }
      // steps
      for (let n = 1; n <= total; n++) {
        const s = model.steps[n - 1];
        msg.textContent = 'Rendering step ' + n + ' of ' + total + '.';
        bar.style.width = (n / total) * 100 + '%';
        await tick();
        doc.addPage();
        if (s.parts.length) { off.v.showStep(n, false); off.v.focusStep(n, true, 40); } else { off.v.showAll(); off.v.setView({ az: -0.95, el: 0.3, dist: 40 }, true); }
        const iw = 186, ih = iw * (1000 / 1240);

        doc.setFontSize(9); doc.setTextColor(110); doc.setFont('helvetica', 'normal'); doc.text(s.stage.toUpperCase() + '   STEP ' + n + ' OF ' + total, mg, 37); doc.setTextColor(0);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.text(s.title, mg + 30, 22);
        const rx = mg + iw + 7, rw = PW - mg - rx;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(11.5);
        const lines = doc.splitTextToSize(s.text, rw);

        const need = stepLots(n);
        if (need.length) {
          doc.setDrawColor(20); doc.setLineWidth(0.4);

            doc.addImage(BW.thumb(l.pid, l.color, l.R), 'PNG', bx + bw / 2 - 8, by, 16, 16);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text(l.qty + 'x', bx + 2, by + 5);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(6.2);

    finally { off.done(); }
  }

    const colors = [BW.COLORS[state.cfg.paint].hex, '#ff6a00', '#111315', '#f2cd37', '#c91a09', '#0055bf'];
    const bits = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, w: 8 + Math.random() * 10, c: colors[(Math.random() * colors.length) | 0], s: (Math.random() - 0.5) * 0.3 }));
    const t0 = performance.now();
    (function loop(now) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      bits.forEach((b) => { b.x += b.vx; b.y += b.vy; b.r += b.s; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.w * 0.3, b.w, b.w * 0.6); ctx.restore(); });

  }

  /* ================= STICKERS ================= */
  function sheetLayout(paper) {
    const W = paper === 'a4' ? 210 : 215.9, H = paper === 'a4' ? 297 : 279.4, m = 14;
    const items = [], labels = [];
    let y = m + 30;
    BW.stickers.defs.forEach((def) => {
      const copies = def.spares === 0 ? def.qty : def.qty * 2;
      let x = m, placed = 0;
      labels.push({ x: m, y: y - 2.2, text: def.name + '   ' + def.w + ' x ' + def.h + ' mm   ' + def.qty + ' needed' + (copies > def.qty ? ', ' + (copies - def.qty) + ' spare' : '') });
      for (let i = 0; i < copies; i++) {
        if (x + def.w > W - m) { x = m; y += def.h + 4; }
        items.push({ id: def.id, x, y, w: def.w, h: def.h }); x += def.w + 5; placed++;
      }
      y += def.h + 11;
    });
    return { W, H, m, items, labels };
  }
  function drawSheet(canvas, pxmm) {
    const L = sheetLayout(state.paper), d = stickerData(), ctx = canvas.getContext('2d');
    canvas.width = Math.round(L.W * pxmm); canvas.height = Math.round(L.H * pxmm);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#111'; ctx.textBaseline = 'alphabetic';
    ctx.font = '600 ' + 5 * pxmm + "px Arial, sans-serif"; ctx.fillText('Grenadier sticker sheet', L.m * pxmm, (L.m + 5) * pxmm);
    ctx.font = '400 ' + 2.9 * pxmm + "px Arial, sans-serif"; ctx.fillStyle = '#555';
    ctx.fillText('Print at 100% (actual size) on white sticker paper. Check that the bar measures 50 mm before you cut.', L.m * pxmm, (L.m + 10.5) * pxmm);
    ctx.fillStyle = '#111'; ctx.fillRect(L.m * pxmm, (L.m + 14) * pxmm, 50 * pxmm, 1.2 * pxmm);
    for (let i = 0; i <= 5; i++) ctx.fillRect((L.m + i * 10) * pxmm - (i === 5 ? 0.3 * pxmm : 0), (L.m + 13) * pxmm, 0.3 * pxmm, 3.2 * pxmm);
    ctx.font = '400 ' + 2.6 * pxmm + "px Arial, sans-serif"; ctx.fillStyle = '#555'; ctx.fillText('50 mm', (L.m + 52) * pxmm, (L.m + 15.6) * pxmm);

    $('#panel').addEventListener('input', onStickerInput);
    $('#stageUI').addEventListener('click', onStageClick);
    $('#stageUI').addEventListener('input', (e) => { if (e.target.id === 'explode') { state.explode = +e.target.value; viewer.setExplode(state.explode); if (state.explode > 0 && state.spin) { /* keep turning */ } } });
    $('#wide').addEventListener('click', onWideClick);
    $('#wide').addEventListener('change', onPhotoChange);
    $('#wide').addEventListener('input', (e) => { if (e.target.id === 'ph-subject') photo.subject = e.target.value; });
    $('#wide').addEventListener('dragover', (e) => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
    $('#wide').addEventListener('dragleave', (e) => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
    $('#wide').addEventListener('drop', (e) => { if (state.view !== 'photo-lab') return; e.preventDefault(); loadPhotoFile(e.dataTransfer.files[0]); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
      if (state.view !== 'build' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !$('#modal').hidden) return;
      if (e.key === 'ArrowRight') goStep(state.step + 1); else if (e.key === 'ArrowLeft') goStep(state.step - 1);
    });
    window.addEventListener('hashchange', route);
    route();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { applyDecals(); if (state.view === 'stickers') renderStickers(); });
  }
  cap.ready = (async () => {
    const c = window.claude;
    if (window.BW_PUBLIC || !c || typeof c.use !== 'function') { cap.native = true; return; }
    try { cap.downloads = await c.use('downloads'); } catch (e) { /* absent */ }
    try { cap.sample = await c.use('sample'); if (cap.sample) { const lim = await cap.sample.limits().catch(() => null); cap.images = !!(lim && lim.images); } } catch (e) { /* absent */ }
  })();
  BW.app = { state, get model() { return model; }, get viewer() { return viewer; }, cap };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
